    <style>
        /* BASIC SETUP */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(-45deg, #1f1c2c, #928dab, #1f1c2c, #4a4e69);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
            overflow: hidden;
            color: #fff;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .ios-glass {
            background: rgba(30, 30, 35, 0.5);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* PLAYER DESKTOP (Default PC Layout) */
        .player {
            width: 95%;
            max-width: 1000px;
            padding: 20px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 30px;
            z-index: 10;
            position: absolute;
            bottom: 40px;
            transition: all 0.4s;
        }

        .disc {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            animation: spin 6s linear infinite paused;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .disc__art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .disc__hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6);
        }

        .player.playing .disc {
            animation-play-state: running;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .meta {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .meta__title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .meta__artist {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 12px;
        }

        .seek-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .time {
            font-size: 12px;
            color: #aaa;
            font-family: monospace;
            white-space: nowrap;
            font-weight: bold;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            --progress: 0%;
            background-image: linear-gradient(#23d5ab, #23d5ab);
            background-size: var(--progress) 100%;
            background-repeat: no-repeat;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 10px;
        }

        .btn {
            background: transparent;
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            padding: 6px;
        }

        .btn:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .btn.is-on {
            color: #23d5ab;
            opacity: 1;
        }

        .btn--play {
            background: #ffffff;
            color: #1e1e1e;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            opacity: 1;
            margin: 0 5px;
        }

        /* VOLUME */
        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }

        .vol-popup {
            position: absolute;
            bottom: 70px;
            left: 50%;
            border-radius: 20px;
            padding: 15px 10px 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px) scale(0.9);
            transition: all 0.4s;
            z-index: 100;
        }

        .vol-popup.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .vol-percentage {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .vol-percentage.boosted {
            color: #ff3b30;
        }

        .vol-slider-wrap {
            height: 110px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="range"]#volume-bar {
            width: 110px;
            height: 6px;
            transform: rotate(-90deg);
            background-image: linear-gradient(#fff, #fff);
        }

        /* MODAL & SCROLLBAR */
        .playlist-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .playlist-modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(35, 35, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            width: 90%;
            max-width: 440px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(40px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .playlist-modal-overlay.open .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 22px;
            font-weight: 700;
        }

        #close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: #fff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        #close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: rgba(255, 255, 255, 0.5);
        }

        .search-bar {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .category-filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .category-filters::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
        }

        .cat-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .cat-btn.active {
            background: #23d5ab;
            color: #111;
            font-weight: 700;
            border-color: #23d5ab;
            box-shadow: 0 4px 15px rgba(35, 213, 171, 0.4);
        }

        .custom-options {
            list-style: none;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 8px;
            margin-right: -4px;
        }

        .custom-options li {
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .custom-options li:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        .custom-options li.active-option {
            background: rgba(35, 213, 171, 0.15);
            border-color: rgba(35, 213, 171, 0.3);
        }

        .list-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .custom-options li img {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .custom-options li div {
            display: flex;
            flex-direction: column;
        }

        .custom-options li span.title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
            font-size: 14px;
        }

        .custom-options li span.artist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .custom-options li.active-option span.title {
            color: #23d5ab;
        }

        .cat-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ddd;
        }

        .custom-options::-webkit-scrollbar {
            width: 6px;
        }

        .custom-options::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }

        .custom-options::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }


        /* ==========================================
           🌟 ALL DEVICE RESPONSIVE MEDIA QUERIES 🌟
           ========================================== */

        /* 1. 4K TVs & Large Projectors (> 1440px) */
        @media (min-width: 1440px) {
            .player {
                max-width: 1200px;
                padding: 25px 40px;
                gap: 40px;
                bottom: 60px;
            }

            .disc {
                width: 90px;
                height: 90px;
            }

            .meta__title {
                font-size: 24px;
            }

            .meta__artist {
                font-size: 16px;
            }

            .btn svg {
                width: 26px;
                height: 26px;
            }

            .btn--play {
                width: 56px;
                height: 56px;
            }

            .btn--play svg {
                width: 30px;
                height: 30px;
            }
        }

        /* 2. Tablets & Small Laptops (801px to 1024px) */
        @media (max-width: 1024px) and (min-width: 801px) {
            .player {
                width: 96%;
                padding: 15px 20px;
                gap: 15px;
            }

            .disc {
                width: 65px;
                height: 65px;
            }

            .meta__title {
                font-size: 16px;
            }
        }

        /* 3. Mobile Card Layout (< 800px) */
        @media (max-width: 800px) {
            body {
                align-items: center;
                padding-bottom: 0;
            }

            .player {
                position: relative;
                bottom: 0;
                flex-direction: column;
                width: 90%;
                max-width: 400px;
                padding: 35px 25px;
                border-radius: 35px;
                gap: 25px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            }

            .disc {
                width: 220px;
                height: 220px;
                margin: 0 auto;
                border-radius: 20px;
                animation: none !important;
            }

            .disc__art {
                border-radius: 20px;
            }

            .disc__hub {
                display: none;
            }

            .meta {
                text-align: center;
                width: 100%;
                max-width: 100%;
            }

            .meta__title {
                font-size: 22px;
                margin-bottom: 6px;
            }

            .seek-container {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .time {
                display: flex;
                justify-content: space-between;
                width: 100%;
                font-size: 13px;
            }

            .controls {
                width: 100%;
                justify-content: space-between;
                margin-top: 10px;
                margin-left: 0;
            }

            .volume-wrapper {
                position: absolute;
                top: 25px;
                right: 25px;
            }

            .vol-popup {
                top: 50px;
                bottom: auto;
                left: auto;
                right: -10px;
                transform: translateY(-10px) scale(0.9);
            }

            .vol-popup.show {
                transform: translateY(0) scale(1);
            }

            .modal-content {
                width: 95%;
                padding: 20px;
                max-height: 85vh;
            }
        }

        /* 4. Small Phones (< 400px) */
        @media (max-width: 400px) {
            .player {
                padding: 25px 20px;
                width: 95%;
                gap: 20px;
            }

            .disc {
                width: 180px;
                height: 180px;
            }

            .meta__title {
                font-size: 20px;
            }

            .btn--play {
                width: 50px;
                height: 50px;
            }

            .vol-popup {
                right: -5px;
            }
        }

        /* 5. Very Small Phones / Smart Displays (< 350px) */
        @media (max-width: 350px) {
            .player {
                padding: 20px 15px;
            }

            .disc {
                width: 150px;
                height: 150px;
            }

            .meta__title {
                font-size: 18px;
            }

            .btn svg {
                width: 20px;
                height: 20px;
            }

            .btn--play {
                width: 45px;
                height: 45px;
            }

            .btn--play svg {
                width: 22px;
                height: 22px;
            }
        }

        /* 6. Landscape Mode / Photo Frames (Height < 600px) */
        @media (max-height: 600px) and (max-width: 800px) {
            .player {
                padding: 15px 20px;
                gap: 15px;
                flex-direction: row;
                /* Switch back to row */
                width: 95%;
                max-width: none;
                border-radius: 25px;
                margin-top: 20px;
            }

            .disc {
                width: 60px;
                height: 60px;
                margin: 0;
                border-radius: 50%;
            }

            .disc__art {
                border-radius: 50%;
            }

            .meta {
                text-align: left;
            }

            .volume-wrapper {
                position: relative;
                top: 0;
                right: 0;
            }

            .vol-popup {
                bottom: 60px;
                top: auto;
                right: -10px;
                transform: translateY(20px) scale(0.9);
            }
        }

        /* Modal Constraint for small height screens */
        @media (max-height: 500px) {
            .modal-content {
                padding: 15px;
                max-height: 90vh;
            }

            .custom-options {
                max-height: 35vh;
            }
        }
    </style>
</head>

<body>

    <!-- BRANDING -->
    <h1
        style="position: absolute; top: 30px; left: 30px; font-size: 24px; font-weight: bold; letter-spacing: 2px; color: rgba(255,255,255,0.3); z-index: 1;">
        BEAT BOX X</h1>

    <!-- PLAYER UI -->
    <main>
        <section class="player ios-glass" id="player">
            <div class="disc" id="disc">
                <img id="cover" class="disc__art" src="" alt="Beat Box X Cover Art">
                <span class="disc__hub"></span>
            </div>
            <div class="meta">
                <p class="meta__title" id="title">Loading Beat Box X...</p>
                <p class="meta__artist" id="artist">Please wait</p>
                <div class="seek-container">
                    <input type="range" id="seek-bar" value="0" max="100" aria-label="Seek progress">
                    <div class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></div>
                </div>
            </div>
            <div class="controls">
                <button id="shuffle" class="btn" aria-label="Shuffle"><svg viewBox="0 0 24 24" width="20" height="20"
                        fill="currentColor">
                        <path
                            d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                    </svg></button>
                <button id="prev" class="btn" aria-label="Previous track"><svg viewBox="0 0 24 24" width="22"
                        height="22" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
                    </svg></button>
                <button id="play" class="btn btn--play" aria-label="Play/Pause">
                    <svg id="i-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M8 5v14l11-7z"></path>
                    </svg>
                    <svg id="i-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"
                        style="display:none;">
                        <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
                    </svg>
                </button>
                <button id="next" class="btn" aria-label="Next track"><svg viewBox="0 0 24 24" width="22" height="22"
                        fill="currentColor">
                        <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"></path>
                    </svg></button>
                <button id="listBtn" class="btn" aria-label="Open Playlist"><svg viewBox="0 0 24 24" width="20"
                        height="20" fill="currentColor">
                        <path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6.5l4 3-4 3z"></path>
                    </svg></button>
            </div>
            <div class="volume-wrapper">
                <div class="vol-popup ios-glass" id="vol-popup">
                    <span id="vol-percent-text" class="vol-percentage">100%</span>
                    <div class="vol-slider-wrap"><input type="range" id="volume-bar" min="0" max="2" step="0.02"
                            value="1" aria-label="Volume Boost"></div>
                </div>
                <button id="mute-btn" class="btn" aria-label="Volume controls">
                    <svg id="vol-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3z"></path>
                        <path id="vol-low" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z">
                        </path>
                        <path id="vol-high"
                            d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z">
                        </path>
                        <path id="vol-muted"
                            d="M21.28 19.86L4.14 2.72c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41l17.14 17.14c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41z"
                            style="display: none;"></path>
                    </svg>
                </button>
            </div>
            <audio id="audio-player" crossorigin="anonymous"></audio>
        </section>
    </main>

    <!-- PLAYLIST MODAL -->
    <div class="playlist-modal-overlay" id="playlist-modal" role="dialog" aria-modal="true">
        <div class="modal-content ios-glass">
            <div class="modal-header">
                <h3>Beat Box X Playlist</h3>
                <button id="close-modal-btn" aria-label="Close Playlist">×</button>
            </div>
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
                <input type="text" id="song-search" class="search-bar" placeholder="Search song in Beat Box X...">
            </div>
            <div class="category-filters" id="category-filters"></div>
            <ul class="custom-options" id="custom-options-list"></ul>
        </div>
    </div>

    <!-- JAVASCRIPT: FETCHING JSON DATA -->
    <script>
        let playlistData = [];
        const audio = document.getElementById("audio-player");
        const customOptionsList = document.getElementById("custom-options-list");
        const categoryFilters = document.getElementById("category-filters");
        const songSearchInput = document.getElementById("song-search");

        let isPlaying = false, isShuffle = false, currentTrackIndex = 0;
        let activeCategory = "All";

        fetch('playlist.json')
            .then(response => {
                if (!response.ok) throw new Error("playlist.json not found");
                return response.json();
            })
            .then(data => {
                playlistData = data;
                if (playlistData.length > 0) {
                    setupCategories();
                    loadTrack(0);
                } else {
                    document.getElementById("title").innerText = "No Songs Available";
                    document.getElementById("artist").innerText = "Add songs via Python script";
                }
            })
            .catch(error => {
                console.error("Error loading Beat Box X playlist:", error);
                document.getElementById("title").innerText = "Error Loading Songs";
                document.getElementById("artist").innerText = "Could not fetch playlist.json";
            });

        function setupCategories() {
            categoryFilters.innerHTML = "";
            const uniqueCats = ["All", ...new Set(playlistData.map(song => song.category).filter(c => c))];
            uniqueCats.forEach(cat => {
                let btn = document.createElement("button");
                btn.className = `cat-btn ${cat === "All" ? "active" : ""}`;
                btn.innerText = cat;
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    activeCategory = cat;
                    filterSongs(songSearchInput.value);
                });
                categoryFilters.appendChild(btn);
            });
        }

        function renderPlaylist() {
            customOptionsList.innerHTML = "";
            playlistData.forEach((track, index) => {
                let li = document.createElement("li");
                li.dataset.category = track.category || "All";

                li.innerHTML = `
                    <div class="list-left">
                        <img src="${track.cover || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'}" alt="${track.title} Cover Art">
                        <div>
                            <span class="title">${track.title}</span>
                            <span class="artist">${track.artist}</span>
                        </div>
                    </div>
                    <span class="cat-tag">${track.category || ""}</span>
                `;

                if (index === currentTrackIndex) li.classList.add("active-option");
                li.addEventListener("click", () => {
                    loadTrack(index);
                    if (!isPlaying) { isPlaying = true; updatePlayState(); }
                    document.getElementById("playlist-modal").classList.remove("open");
                });
                customOptionsList.appendChild(li);
            });
        }

        function filterSongs(searchTerm) {
            const term = searchTerm.toLowerCase();
            const items = customOptionsList.getElementsByTagName("li");
            Array.from(items).forEach(item => {
                const matchesSearch = item.innerText.toLowerCase().includes(term);
                const matchesCategory = activeCategory === "All" || item.dataset.category === activeCategory;
                item.style.display = (matchesSearch && matchesCategory) ? "flex" : "none";
            });
        }
        songSearchInput.addEventListener("input", (e) => filterSongs(e.target.value));

        function loadTrack(index) {
            if (!playlistData.length) return;
            currentTrackIndex = index;
            const track = playlistData[index];
            audio.src = track.src;

            document.getElementById("title").innerText = track.title;
            document.getElementById("artist").innerText = track.artist;
            document.getElementById("cover").src = track.cover || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400';

            document.title = `${track.title} - Beat Box X`;

            renderPlaylist();
            filterSongs(songSearchInput.value);
            if (isPlaying) audio.play();
        }

        function updatePlayState() {
            if (isPlaying) {
                audio.play();
                document.getElementById("i-play").style.display = "none";
                document.getElementById("i-pause").style.display = "block";
                document.getElementById("player").classList.add("playing");
            } else {
                audio.pause();
                document.getElementById("i-play").style.display = "block";
                document.getElementById("i-pause").style.display = "none";
                document.getElementById("player").classList.remove("playing");
                document.title = "Beat Box X | Premium Liquid Glass Music Player";
            }
        }

        document.getElementById("play").addEventListener("click", () => { if (playlistData.length) { isPlaying = !isPlaying; updatePlayState(); } });
        document.getElementById("shuffle").addEventListener("click", () => { isShuffle = !isShuffle; document.getElementById("shuffle").classList.toggle("is-on"); });

        function playNext() {
            if (!playlistData.length) return;
            if (isShuffle) loadTrack(Math.floor(Math.random() * playlistData.length));
            else loadTrack((currentTrackIndex + 1) % playlistData.length);
            if (!isPlaying) { isPlaying = true; updatePlayState(); }
        }
        function playPrev() {
            if (!playlistData.length) return;
            loadTrack((currentTrackIndex - 1 + playlistData.length) % playlistData.length);
            if (!isPlaying) { isPlaying = true; updatePlayState(); }
        }

        document.getElementById("next").addEventListener("click", playNext);
        document.getElementById("prev").addEventListener("click", playPrev);
        audio.addEventListener("ended", playNext);

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById("seek-bar").value = percent;
                document.getElementById("seek-bar").style.setProperty('--progress', `${percent}%`);
                let curMin = Math.floor(audio.currentTime / 60), curSec = Math.floor(audio.currentTime % 60);
                let durMin = Math.floor(audio.duration / 60), durSec = Math.floor(audio.duration % 60);
                document.getElementById("tCur").innerText = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;
                document.getElementById("tDur").innerText = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
            }
        });
        document.getElementById("seek-bar").addEventListener("input", (e) => { audio.currentTime = (e.target.value / 100) * audio.duration; });

        document.getElementById("listBtn").addEventListener("click", () => {
            document.getElementById("playlist-modal").classList.add("open");
            setTimeout(() => songSearchInput.focus(), 100);
        });
        document.getElementById("close-modal-btn").addEventListener("click", () => document.getElementById("playlist-modal").classList.remove("open"));

        // Volume logic handlers
        let clickTimer = null, isVolPopupOpen = false;
        const muteBtn = document.getElementById("mute-btn"), volPopup = document.getElementById("vol-popup"), volumeBar = document.getElementById("volume-bar");

        muteBtn.addEventListener("click", (e) => {
            if (e.detail === 1) {
                clickTimer = setTimeout(() => {
                    isVolPopupOpen = !isVolPopupOpen;
                    if (isVolPopupOpen) volPopup.classList.add("show");
                    else volPopup.classList.remove("show");
                }, 250);
            }
        });

        window.addEventListener("click", (e) => {
            if (e.target !== muteBtn && !muteBtn.contains(e.target) && e.target !== volPopup && !volPopup.contains(e.target)) {
                volPopup.classList.remove("show"); isVolPopupOpen = false;
            }
        });

        volumeBar.style.setProperty('--progress', '50%');
        volumeBar.addEventListener("input", (e) => {
            const newVol = parseFloat(e.target.value);
            audio.volume = Math.min(newVol, 1);
            volumeBar.style.setProperty('--progress', `${(newVol / 2) * 100}%`);
            document.getElementById("vol-percent-text").innerText = Math.round(newVol * 100) + "%";
        });
    </script>
</body>

</html>
