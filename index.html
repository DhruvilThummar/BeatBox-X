<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <title>Beat Box X | Music Player</title>
    <meta name="theme-color" content="#D4AF37"> 

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #0a0a0c, #1a1a24, #0a0a0c, #1f1f2e);
            background-size: 400% 400%; animation: gradientBG 20s ease infinite;
            min-height: 100vh; width: 100vw; display: flex; align-items: center; 
            justify-content: center; color: #fff; padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ios-glass {
            background: rgba(20, 20, 25, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .player { width: 100%; max-width: 450px; padding: 25px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        .disc { width: 180px; height: 180px; border-radius: 20px; position: relative; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); border: 2px solid rgba(212, 175, 55, 0.3); overflow: hidden; }
        .disc__art { width: 100%; height: 100%; object-fit: cover; }
        
        .meta { text-align: center; width: 100%; }
        .meta__title { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        .meta__artist { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .meta__quote { font-size: 12px; color: #D4AF37; font-style: italic; font-weight: 600; margin-bottom: 15px; }

        .seek-container { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 5px; cursor: pointer; background-image: linear-gradient(#D4AF37, #D4AF37); background-size: 0% 100%; background-repeat: no-repeat; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; }

        .controls { display: flex; align-items: center; gap: 25px; justify-content: center; width: 100%; }
        .btn { background: transparent; color: #fff; border: none; cursor: pointer; padding: 10px; }
        .btn--play { background: #D4AF37; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; color: #000; }

        .spinner { animation: rotate 2s linear infinite; width: 30px; height: 30px; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* Modal */
        .modal { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal.open { visibility: visible; opacity: 1; }
        .modal-content { background: #1a1a24; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #D4AF37; }
        .options { list-style: none; max-height: 40vh; overflow-y: auto; margin-top: 15px; }
        .options li { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    </style>
</head>

<body>

    <h1 style="position: absolute; top: 20px; font-size: 20px; color: #D4AF37; letter-spacing: 2px;">BEAT BOX X</h1>

    <section class="player ios-glass" id="player">
        <div class="disc"><img id="cover" class="disc__art" src="" alt="Art"></div>
        <div class="meta">
            <p class="meta__title" id="title">Loading...</p>
            <p class="meta__artist" id="artist">...</p>
            <p class="meta__quote" id="quote-text"></p>
            <div class="seek-container">
                <input type="range" id="seek-bar" value="0" max="100">
                <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa;">
                    <span id="tCur">0:00</span> <span id="tDur">0:00</span>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="play" class="btn btn--play">
                <svg id="i-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                <svg id="i-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"></path></svg>
                <svg id="i-loader" class="spinner" viewBox="0 0 50 50" style="display:none;"><circle cx="25" cy="25" r="20" fill="none" stroke="#000" stroke-width="4"></circle></svg>
            </button>
            <button id="next" class="btn"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg></button>
            <button id="listBtn" class="btn"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3z"></path></svg></button>
        </div>
        <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>
    </section>

    <div class="modal" id="playlist-modal">
        <div class="modal-content ios-glass">
            <input type="text" id="song-search" class="search-bar" placeholder="🔍 Search...">
            <ul class="options" id="options-list"></ul>
            <button id="close-modal" style="width:100%; padding:10px; background:#D4AF37; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Close</button>
        </div>
    </div>

    <script>
        let playlistData = [], currentTrackIndex = 0;
        const audio = document.getElementById("audio-player");
        const optionsList = document.getElementById("options-list");
        const songSearch = document.getElementById("song-search");
        const shayariList = ["🎵 संगीत ही रूह की असली दवा है...", "✨ धुन में खो जाना ही सबसे बड़ी खुशी है।", "🎶 संगीत वो भाषा है जो सीधे दिल को छू जाती है।", "🤎 दिल की धड़कनों से मिलता है संगीत का सुकून।"];

        fetch('playlist.json').then(r => r.json()).then(data => {
            playlistData = data;
            if (playlistData.length > 0) loadTrack(Math.floor(Math.random() * playlistData.length));
        });

        function loadTrack(index) {
            currentTrackIndex = index;
            const t = playlistData[index];
            audio.src = t.src;
            document.getElementById("title").innerText = t.title;
            document.getElementById("artist").innerText = t.artist;
            document.getElementById("cover").src = t.cover;
            document.getElementById("quote-text").innerText = `"${shayariList[Math.floor(Math.random() * shayariList.length)]}"`;
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-loader").style.display = "block";
            audio.play().catch(e => console.log(e));
        }

        audio.onplaying = () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "block";
        };

        audio.onpause = () => {
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-play").style.display = "block";
        };

        document.getElementById("play").onclick = () => audio.paused ? audio.play() : audio.pause();
        document.getElementById("next").onclick = () => loadTrack((currentTrackIndex + 1) % playlistData.length);
        document.getElementById("listBtn").onclick = () => { document.getElementById("playlist-modal").classList.add("open"); renderList(); };
        document.getElementById("close-modal").onclick = () => document.getElementById("playlist-modal").classList.remove("open");

        function renderList() {
            optionsList.innerHTML = "";
            playlistData.forEach((t, i) => {
                let li = document.createElement("li");
                li.innerHTML = `<img src="${t.cover}" width="40" height="40" style="border-radius:8px;"> <span>${t.title}</span>`;
                li.onclick = () => { loadTrack(i); document.getElementById("playlist-modal").classList.remove("open"); };
                optionsList.appendChild(li);
            });
        }

        audio.ontimeupdate = () => {
            if (audio.duration && !isNaN(audio.duration)) {
                document.getElementById("seek-bar").value = (audio.currentTime / audio.duration) * 100;
                document.getElementById("seek-bar").style.backgroundSize = (audio.currentTime / audio.duration) * 100 + "% 100%";
            }
        };
    </script>
</body>
</html>
