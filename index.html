    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* Hide scrollbars visually across all elements */
        ::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0a0a0c;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            display: flex;
            flex-direction: column;
            background: linear-gradient(-45deg, #0a0a0c, #1a1a24, #0a0a0c, #1f1f2e);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🌟 STICKY TOP APP BAR 🌟 */
        .top-app-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(56px + env(safe-area-inset-top, 0px));
            padding-top: env(safe-area-inset-top, 0px);
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            background: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 400;
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: rgba(212, 175, 55, 0.95);
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin: 0;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 🌟 MAIN SCROLLABLE APP CONTENT AREA 🌟 */
        .app-main {
            flex: 1;
            height: 100dvh;
            width: 100vw;
            overflow-y: auto;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: calc(60px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
        }

        /* 🌟 FIXED BOTTOM NAVIGATION BAR 🌟 */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(64px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            background: rgba(12, 12, 16, 0.88);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 500;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            background: transparent;
            border: none;
            cursor: pointer;
            min-width: 48px;
            min-height: 48px;
            padding: 4px 12px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            gap: 3px;
            transition: color 0.2s, transform 0.1s ease, opacity 0.1s ease;
        }

        .nav-item.active {
            color: #D4AF37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .nav-item:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        /* 🌟 GLASSMORPHISM & PLAYER CARDS 🌟 */
        .ios-glass {
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .player {
            width: 100%;
            max-width: 800px;
            padding: 20px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
            transition: all 0.4s;
        }

        .disc {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            animation: spin 6s linear infinite paused;
            border: 2px solid rgba(212, 175, 55, 0.5);
            overflow: hidden;
        }

        .disc__art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .disc__hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
        }

        .player.playing .disc {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .meta {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .meta__title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta__artist {
            font-size: 12px;
            color: #b3b3b3;
            margin-bottom: 4px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta__quote {
            font-size: 11px;
            color: #D4AF37;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 8px;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seek-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .time {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            font-weight: 600;
        }

        input[type="range"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            --progress: 0%;
            background-image: linear-gradient(#D4AF37, #FFD700);
            background-size: var(--progress) 100%;
            background-repeat: no-repeat;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.9);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            margin-left: 10px;
        }

        /* 🌟 TOUCH ERGONOMICS & ACTIVE FEEDBACK 🌟 */
        .btn {
            background: transparent;
            color: #fff;
            border: none;
            cursor: pointer;
            opacity: 0.85;
            min-width: 48px;
            min-height: 48px;
            border-radius: 50%;
            transition: transform 0.1s ease, opacity 0.1s ease, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.90);
            opacity: 0.7;
        }

        .btn.is-on {
            color: #D4AF37;
            opacity: 1;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .btn--play {
            background: linear-gradient(135deg, #D4AF37, #B8860B);
            border-radius: 50%;
            width: 54px;
            height: 54px;
            opacity: 1;
            color: #000;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            margin: 0 4px;
        }

        .btn--play:active {
            transform: scale(0.92);
        }

        .spinner {
            animation: rotate 2s linear infinite;
            width: 24px;
            height: 24px;
        }

        /* 🌟 VOLUME POPUP 🌟 */
        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vol-popup {
            position: absolute;
            bottom: 65px;
            left: 50%;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(15px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .vol-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .vol-percentage {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #D4AF37;
        }

        .vol-slider-wrap {
            height: 100px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="range"]#volume-bar {
            width: 100px;
            height: 5px;
            transform: rotate(-90deg);
            background-image: linear-gradient(#D4AF37, #D4AF37);
        }

        /* 🌟 NATIVE BOTTOM SHEET MODAL 🌟 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
        }

        .modal.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(18, 18, 24, 0.96);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            width: 100%;
            max-width: 550px;
            padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal.open .modal-content {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0 auto 16px;
        }

        .search-bar {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .options {
            list-style: none;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 2px;
            scrollbar-width: none;
        }

        .options li {
            padding: 12px 14px;
            min-height: 52px;
            border-radius: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 6px;
            transition: background 0.2s, transform 0.1s ease;
        }

        .options li:active {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(0.98);
        }

        .options li img {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .options li div {
            display: flex;
            flex-direction: column;
        }

        .options li span.s-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 🌟 SKELETON LOADERS (ZERO CLS) 🌟 */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(212, 175, 55, 0.18) 50%, rgba(255, 255, 255, 0.05) 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.6s infinite ease-in-out;
            border-radius: 8px;
        }

        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            width: 100%;
            max-width: 800px;
            padding: 20px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.15);
            transition: opacity 0.4s ease;
        }

        .skeleton-disc {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .skeleton-meta {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skeleton-title { height: 18px; width: 60%; }
        .skeleton-artist { height: 14px; width: 40%; }
        .skeleton-bar { height: 6px; width: 100%; border-radius: 3px; }

        @media (max-width: 800px) {
            .skeleton-card {
                flex-direction: column;
                max-width: 380px;
                padding: 26px 20px;
                border-radius: 32px;
                gap: 18px;
            }
            .skeleton-disc {
                width: 220px;
                height: 220px;
                border-radius: 24px;
            }
            .skeleton-title { width: 80%; }
            .skeleton-artist { width: 60%; }
        }
    </style>
</head>

<body>

    <!-- 🌟 STICKY TOP APP BAR 🌟 -->
    <header class="top-app-bar">
        <h1 class="app-title">BEAT BOX X</h1>
        <div class="top-bar-actions">
            <button id="top-search-btn" class="btn" aria-label="Search Tracks">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- 🌟 MAIN CONTENT SCROLL AREA 🌟 -->
    <main class="app-main">

        <!-- 🌟 SKELETON LOADER (ZERO CLS FALLBACK) 🌟 -->
        <div id="player-skeleton" class="skeleton-card">
            <div class="skeleton skeleton-disc"></div>
            <div class="skeleton-meta">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-artist"></div>
                <div class="skeleton skeleton-bar"></div>
            </div>
        </div>

        <!-- 🌟 LIVE PLAYER CARD 🌟 -->
        <section class="player ios-glass" id="player" style="display:none; opacity:0; transition: opacity 0.4s ease;">
            <!-- IMAGE -->
            <div class="disc" id="disc">
                <img id="cover" class="disc__art" src="" alt="Cover Art">
                <span class="disc__hub"></span>
            </div>

            <!-- SONG INFO & SEEK BAR -->
            <div class="meta">
                <p class="meta__title" id="title">Loading Cloud Sync...</p>
                <p class="meta__artist" id="artist">Please wait...</p>
                <p class="meta__quote" id="quote-text">"संगीत ही रूह की असली दवा है..."</p>

                <div class="seek-container">
                    <input type="range" id="seek-bar" value="0" max="100">
                    <div class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div class="controls">
                <!-- Shuffle -->
                <button id="shuffle" class="btn" aria-label="Shuffle"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                    </svg></button>

                <!-- Previous -->
                <button id="prev" class="btn" aria-label="Previous"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
                    </svg></button>

                <!-- Play / Pause / Loader -->
                <button id="play" class="btn btn--play" aria-label="Play/Pause">
                    <svg id="i-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M8 5v14l11-7z"></path>
                    </svg>
                    <svg id="i-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="display:none;">
                        <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
                    </svg>
                    <svg id="i-loader" class="spinner" viewBox="0 0 50 50" style="display:none;">
                        <circle cx="25" cy="25" r="20" fill="none" stroke="#000" stroke-width="4"></circle>
                    </svg>
                </button>

                <!-- Next -->
                <button id="next" class="btn" aria-label="Next Track"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                        <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"></path>
                    </svg></button>

                <!-- Playlist -->
                <button id="listBtn" class="btn" aria-label="Open Playlist"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3z"></path>
                    </svg></button>

                <!-- Volume 200% -->
                <div class="volume-wrapper">
                    <div class="vol-popup" id="vol-popup">
                        <span id="vol-percent-text" class="vol-percentage">100%</span>
                        <div class="vol-slider-wrap"><input type="range" id="volume-bar" min="0" max="2" step="0.02" value="1"></div>
                    </div>
                    <button id="mute-btn" class="btn" aria-label="Volume controls">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3z"></path>
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"></path>
                            <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>
        </section>
    </main>

    <!-- 🌟 FIXED BOTTOM NAVIGATION BAR 🌟 -->
    <nav class="bottom-nav-bar">
        <button class="nav-item active" id="nav-player">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span>Player</span>
        </button>
        <button class="nav-item" id="nav-search">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <span>Search</span>
        </button>
        <button class="nav-item" id="nav-playlist">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
            </svg>
            <span>Playlist</span>
        </button>
    </nav>

    <!-- 🌟 PLAYLIST & SEARCH BOTTOM SHEET MODAL 🌟 -->
    <div class="modal" id="playlist-modal">
        <div class="modal-content ios-glass">
            <div class="sheet-handle"></div>
            <input type="text" id="song-search" class="search-bar" placeholder="🔍 Search songs, artists...">
            <ul class="options" id="options-list"></ul>
            <button id="close-modal"
                style="width: 100%; padding: 14px; margin-top: 15px; background: linear-gradient(135deg, #D4AF37, #B8860B); border: none; border-radius: 14px; font-weight: bold; cursor: pointer; color: #000; font-family: 'Quicksand', sans-serif; font-size: 15px;">Close Playlist</button>
        </div>
    </div>

    <script>
        let playlistData = [];
        let currentTrackIndex = 0;
        let isShuffle = false;

        const audio = document.getElementById("audio-player");
        const optionsList = document.getElementById("options-list");
        const songSearch = document.getElementById("song-search");
        const playBtn = document.getElementById("play");
        const shuffleBtn = document.getElementById("shuffle");

        const shayariList = [
            "✨ कुछ धुनें कभी पुरानी नहीं होतीं, बस यादें ताज़ा कर देती हैं।",
            "🤎 लफ़्ज़ों की कमी को, संगीत अक्सर पूरा कर देता है।",
            "🎶 वो गीत ही क्या, जो दिल के तारों को न छुए।",
            "🌟 शोर भरी इस दुनिया में, संगीत ही मेरा सुकून है।",
            "🎵 हर गाने में एक चेहरा, और हर चेहरे में एक कहानी छिपी होती है।",
            "💫 कुछ बातें होंठों से नहीं, बस इयरफ़ोन से समझी जाती हैं।",
            "✨ संगीत वो जादू है, जो बिना छुए दिल को सहला देता है।"
        ];

        // 🌟 LOAD PLAYLIST & SWAP SKELETON FOR PLAYER (SMOOTH FADE TRANSITION) 🌟
        fetch('playlist.json').then(r => r.json()).then(data => {
            playlistData = data;
            if (playlistData.length > 0) {
                const randomIdx = Math.floor(Math.random() * playlistData.length);
                loadTrack(randomIdx);
            }

            // Smooth skeleton fallback transition
            const skeletonEl = document.getElementById("player-skeleton");
            const playerEl = document.getElementById("player");
            if (skeletonEl && playerEl) {
                skeletonEl.style.opacity = "0";
                setTimeout(() => {
                    skeletonEl.style.display = "none";
                    playerEl.style.display = "flex";
                    requestAnimationFrame(() => {
                        playerEl.style.opacity = "1";
                    });
                }, 300);
            }
        });

        // 🌟 PLAY TRACK FUNCTION 🌟
        function loadTrack(index) {
            currentTrackIndex = index;
            const track = playlistData[index];
            showLoading();
            audio.src = track.src;
            document.getElementById("title").innerText = track.title;
            document.getElementById("artist").innerText = track.artist;
            document.getElementById("cover").src = track.cover;

            const randomQuote = shayariList[Math.floor(Math.random() * shayariList.length)];
            document.getElementById("quote-text").innerText = `"${randomQuote}"`;

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: 'Beat Box X',
                    artwork: [
                        { src: track.cover, sizes: '256x256', type: 'image/jpeg' },
                        { src: track.cover, sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { audio.play().catch(e => console.log(e)); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }

            audio.play().catch(e => console.log(e));
        }

        // 🌟 UI STATES 🌟
        function showLoading() {
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-loader").style.display = "block";
            document.getElementById("player").classList.remove("playing");
        }

        audio.addEventListener("playing", () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "block";
            document.getElementById("player").classList.add("playing");
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        });

        audio.addEventListener("pause", () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-play").style.display = "block";
            document.getElementById("player").classList.remove("playing");
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        });

        playBtn.addEventListener("click", () => {
            if (audio.paused) { audio.play().catch(e => console.log(e)); }
            else { audio.pause(); }
        });

        shuffleBtn.addEventListener("click", () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle("is-on");
        });

        function playNext() {
            if (!playlistData.length) return;
            if (isShuffle) loadTrack(Math.floor(Math.random() * playlistData.length));
            else loadTrack((currentTrackIndex + 1) % playlistData.length);
        }

        function playPrev() {
            if (!playlistData.length) return;
            loadTrack((currentTrackIndex - 1 + playlistData.length) % playlistData.length);
        }

        document.getElementById("next").addEventListener("click", playNext);
        document.getElementById("prev").addEventListener("click", playPrev);
        audio.addEventListener("ended", playNext);

        // 🌟 PLAYLIST MODAL & SEARCH 🌟
        const openModal = () => {
            document.getElementById("playlist-modal").classList.add("open");
            renderList();
        };

        const closeModal = () => document.getElementById("playlist-modal").classList.remove("open");

        document.getElementById("listBtn").addEventListener("click", openModal);
        document.getElementById("top-search-btn").addEventListener("click", openModal);
        document.getElementById("nav-search").addEventListener("click", openModal);
        document.getElementById("nav-playlist").addEventListener("click", openModal);
        document.getElementById("close-modal").addEventListener("click", closeModal);

        function renderList() {
            optionsList.innerHTML = "";
            playlistData.forEach((t, i) => {
                let li = document.createElement("li");
                li.innerHTML = `
                    <img src="${t.cover}" alt="Cover">
                    <div>
                        <span class="s-title">${t.title}</span>
                        <span class="s-artist">${t.artist}</span>
                    </div>
                `;
                li.onclick = () => { loadTrack(i); closeModal(); };
                optionsList.appendChild(li);
            });
        }

        songSearch.addEventListener("input", (e) => {
            const val = e.target.value.toLowerCase();
            const items = optionsList.getElementsByTagName("li");
            Array.from(items).forEach(li => {
                li.style.display = li.innerText.toLowerCase().includes(val) ? "flex" : "none";
            });
        });

        // 🌟 TIME & SEEK BAR 🌟
        audio.addEventListener("timeupdate", () => {
            let curMin = Math.floor(audio.currentTime / 60);
            let curSec = Math.floor(audio.currentTime % 60);
            document.getElementById("tCur").innerText = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;

            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById("seek-bar").value = percent;
                document.getElementById("seek-bar").style.setProperty('--progress', `${percent}%`);

                let durMin = Math.floor(audio.duration / 60);
                let durSec = Math.floor(audio.duration % 60);
                document.getElementById("tDur").innerText = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
            } else {
                document.getElementById("tDur").innerText = "0:00";
            }
        });

        document.getElementById("seek-bar").addEventListener("input", (e) => {
            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
        });

        // 🌟 VOLUME 200% LOGIC 🌟
        let clickTimer = null, isVolPopupOpen = false;
        const muteBtn = document.getElementById("mute-btn"), volPopup = document.getElementById("vol-popup"), volumeBar = document.getElementById("volume-bar");

        muteBtn.addEventListener("click", (e) => {
            if (e.detail === 1) {
                clickTimer = setTimeout(() => {
                    isVolPopupOpen = !isVolPopupOpen;
                    if (isVolPopupOpen) volPopup.classList.add("show");
                    else volPopup.classList.remove("show");
                }, 200);
            }
        });

        window.addEventListener("click", (e) => {
            if (e.target !== muteBtn && !muteBtn.contains(e.target) && e.target !== volPopup && !volPopup.contains(e.target)) {
                volPopup.classList.remove("show"); isVolPopupOpen = false;
            }
        });

        volumeBar.style.setProperty('--progress', '50%');
        volumeBar.addEventListener("input", (e) => {
            const newVol = parseFloat(e.target.value);
            audio.volume = Math.min(newVol, 1);
            volumeBar.style.setProperty('--progress', `${(newVol / 2) * 100}%`);
            document.getElementById("vol-percent-text").innerText = Math.round(newVol * 100) + "%";
        });
    </script>

    <!-- 🌟 ASYNCHRONOUS LAZY LOADING OF HEAVY 3D BACKGROUND (UNBLOCK MAIN THREAD) 🌟 -->
    <script>
        function load3DBackground() {
            const threeScript = document.createElement('script');
            threeScript.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
            threeScript.async = true;
            threeScript.onload = () => {
                const bgScript = document.createElement('script');
                bgScript.src = "three-bg.js";
                bgScript.async = true;
                bgScript.onload = () => {
                    if (window.ThreeBackground) {
                        new window.ThreeBackground({
                            primaryColor: 0xD4AF37,
                            secondaryColor: 0x4a3b10,
                            particleCount: 1000
                        });
                    }
                };
                document.body.appendChild(bgScript);
            };
            document.body.appendChild(threeScript);
        }

        // Defer 3D canvas loading until after main UI renders and thread is idle
        if ('requestIdleCallback' in window) {
            requestIdleCallback(load3DBackground, { timeout: 1500 });
        } else {
            window.addEventListener('load', () => setTimeout(load3DBackground, 200));
        }
    </script>
</body>

</html>
