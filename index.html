<html lang="en">

<head>

    <!-- ==========================================
         🌟 PREMIUM FONTS (CINZEL FOR LOGO, QUICKSAND FOR APP) 🌟
         ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">

    <title>Beat Box X | Premium Cloud Music Player</title>
    <meta name="theme-color" content="#D4AF37">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #0a0a0c, #1a1a24, #0a0a0c, #1f1f2e);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            /* 🌟 PC Ma Niche Ni Side 🌟 */
            overflow-x: hidden;
            color: #fff;
            padding: 20px;
            padding-bottom: 40px;
            /* Niche thi space */
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 🌟 MAIN TITLE (PC MA TOP LEFT & NAVO LUXURY FONT) 🌟 */
        .app-title {
            position: fixed;
            top: 30px;
            left: 45px;
            font-family: 'Cinzel', serif;
            /* VIP Font */
            font-size: 32px;
            font-weight: 700;
            color: rgba(212, 175, 55, 0.9);
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            margin: 0;
            z-index: 100;
        }

        /* 🌟 DESKTOP PLAYER LAYOUT (Small & Sleek Bottom Bar) 🌟 */
        .ios-glass {
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .player {
            width: 100%;
            max-width: 800px;
            /* Sleek Size for PC */
            padding: 15px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
            transition: all 0.4s;
        }

        .disc {
            width: 65px;
            /* Small Album Art for PC */
            height: 65px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            animation: spin 6s linear infinite paused;
            border: 2px solid rgba(212, 175, 55, 0.5);
            overflow: hidden;
        }

        .disc__art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .disc__hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
        }

        .player.playing .disc {
            animation-play-state: running;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .meta {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .meta__title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta__artist {
            font-size: 12px;
            color: #b3b3b3;
            margin-bottom: 4px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta__quote {
            font-size: 11px;
            color: #D4AF37;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 8px;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seek-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .time {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            font-weight: 600;
        }

        input[type="range"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            --progress: 0%;
            background-image: linear-gradient(#D4AF37, #FFD700);
            background-size: var(--progress) 100%;
            background-repeat: no-repeat;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .btn {
            background: transparent;
            color: #fff;
            border: none;
            cursor: pointer;
            opacity: 0.7;
            padding: 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .btn.is-on {
            color: #D4AF37;
            opacity: 1;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .btn--play {
            background: linear-gradient(135deg, #D4AF37, #B8860B);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            opacity: 1;
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            margin: 0 5px;
        }

        .spinner {
            animation: rotate 2s linear infinite;
            width: 24px;
            height: 24px;
        }

        /* 🌟 VOLUME 200% POPUP 🌟 */
        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vol-popup {
            position: absolute;
            bottom: 65px;
            left: 50%;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(15px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .vol-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .vol-percentage {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #D4AF37;
        }

        .vol-slider-wrap {
            height: 100px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="range"]#volume-bar {
            width: 100px;
            height: 5px;
            transform: rotate(-90deg);
            background-image: linear-gradient(#D4AF37, #D4AF37);
        }

        /* 🌟 MODAL (PLAYLIST & SEARCH) 🌟 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            width: 92%;
            max-width: 450px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .search-bar {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        .search-bar:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .options {
            list-style: none;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .options::-webkit-scrollbar {
            width: 5px;
        }

        .options::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }

        .options li {
            padding: 12px;
            border-radius: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
            transition: 0.2s;
        }

        .options li:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .options li img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .options li div {
            display: flex;
            flex-direction: column;
        }

        .options li span.s-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .options li span.s-artist {
            font-size: 12px;
            color: #aaa;
            margin-top: 3px;
        }

        /* ==========================================
           📱 MOBILE RESPONSIVE UI FIX (MAX-WIDTH: 800px) 📱
           ========================================== */
        @media (max-width: 800px) {
            body {
                justify-content: center;
                /* 🌟 Mobile Ma Barabar Vachhe (Center) 🌟 */
                padding-bottom: 20px;
            }

            /* Title centered for mobile */
            .app-title {
                position: absolute;
                top: 25px;
                left: 0;
                width: 100%;
                text-align: center;
                font-size: 24px;
                letter-spacing: 3px;
            }

            .player {
                flex-direction: column;
                width: 100%;
                max-width: 380px;
                padding: 30px 20px;
                border-radius: 35px;
                gap: 20px;
                text-align: center;
                margin-top: 20px;
            }

            /* Big Center Album Art for Mobile */
            .disc {
                width: 200px;
                height: 200px;
                border-radius: 20px;
                margin: 0 auto;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
                animation: none !important;
                /* Stop spinning on mobile for clean look */
            }

            .disc__art {
                border-radius: 18px;
            }

            .disc__hub {
                display: none;
            }

            .meta {
                width: 100%;
                align-items: center;
            }

            .meta__title {
                font-size: 22px;
                white-space: normal;
                display: -webkit-box;
                -webkit-line-clamp: 1;
                -webkit-box-orient: vertical;
                overflow: hidden;
                margin-bottom: 5px;
            }

            .meta__artist {
                font-size: 14px;
                margin-bottom: 10px;
            }

            .meta__quote {
                font-size: 13px;
                margin-bottom: 18px;
            }

            /* Seekbar & Time */
            .seek-container {
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .time {
                display: flex;
                justify-content: space-between;
                width: 100%;
                font-size: 13px;
            }

            /* 🌟 Spread out ALL controls evenly on mobile 🌟 */
            .controls {
                width: 100%;
                justify-content: space-between;
                margin: 0;
                padding-top: 10px;
            }

            .btn svg {
                width: 24px;
                height: 24px;
            }

            .btn--play {
                width: 60px;
                height: 60px;
            }

            .btn--play svg {
                width: 28px;
                height: 28px;
            }

            .vol-popup {
                bottom: 85px;
                transform: translateX(-50%) scale(0.9);
            }
        }
    </style>
</head>

<body>

    <!-- 🌟 TITLE -->
    <h1 class="app-title">BEAT BOX X</h1>

    <section class="player ios-glass" id="player">
        <!-- IMAGE -->
        <div class="disc" id="disc">
            <img id="cover" class="disc__art" src="" alt="Cover Art">
            <span class="disc__hub"></span>
        </div>

        <!-- SONG INFO & SEEK BAR -->
        <div class="meta">
            <p class="meta__title" id="title">Loading Cloud Sync...</p>
            <p class="meta__artist" id="artist">Please wait...</p>
            <p class="meta__quote" id="quote-text">"संगीत ही रूह की असली दवा है..."</p>

            <div class="seek-container">
                <input type="range" id="seek-bar" value="0" max="100">
                <div class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></div>
            </div>
        </div>

        <!-- 🌟 ALL CONTROLS RESTORED 🌟 -->
        <div class="controls">
            <!-- Shuffle -->
            <button id="shuffle" class="btn" aria-label="Shuffle"><svg viewBox="0 0 24 24" width="22" height="22"
                    fill="currentColor">
                    <path
                        d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                </svg></button>

            <!-- Previous -->
            <button id="prev" class="btn" aria-label="Previous"><svg viewBox="0 0 24 24" width="26" height="26"
                    fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
                </svg></button>

            <!-- Play / Pause / Loader -->
            <button id="play" class="btn btn--play" aria-label="Play/Pause">
                <svg id="i-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M8 5v14l11-7z"></path>
                </svg>
                <svg id="i-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="display:none;">
                    <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
                </svg>
                <svg id="i-loader" class="spinner" viewBox="0 0 50 50" style="display:none;">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="#000" stroke-width="4"></circle>
                </svg>
            </button>

            <!-- Next -->
            <button id="next" class="btn" aria-label="Next Track"><svg viewBox="0 0 24 24" width="26" height="26"
                    fill="currentColor">
                    <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"></path>
                </svg></button>

            <!-- Playlist -->
            <button id="listBtn" class="btn" aria-label="Open Playlist"><svg viewBox="0 0 24 24" width="24" height="24"
                    fill="currentColor">
                    <path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3z"></path>
                </svg></button>

            <!-- Volume 200% -->
            <div class="volume-wrapper">
                <div class="vol-popup" id="vol-popup">
                    <span id="vol-percent-text" class="vol-percentage">100%</span>
                    <div class="vol-slider-wrap"><input type="range" id="volume-bar" min="0" max="2" step="0.02"
                            value="1"></div>
                </div>
                <button id="mute-btn" class="btn" aria-label="Volume controls">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3z"></path>
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"></path>
                        <path
                            d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
        <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>
    </section>

    <!-- 🌟 PLAYLIST & SEARCH MODAL 🌟 -->
    <div class="modal" id="playlist-modal">
        <div class="modal-content ios-glass">
            <input type="text" id="song-search" class="search-bar" placeholder="🔍 Search songs, artists...">
            <ul class="options" id="options-list"></ul>

                Playlist</button>
        </div>
    </div>

            "🌟 सुरों की मिठास और दिल का एहसास।", "🎶 दिल से सुनो, संगीत में सब कुछ है।",
            "🤎 संगीत एक ऐसा सफर है जिसका कोई अंत नहीं।", "🎵 हर धड़कन में एक धुन छिपी है।",
            "✨ सन्नाटे में भी एक सुर होता है।", "💫 अपनी पसंद का संगीत सुनें, खुश रहें।",
            "🎶 रूह को सुकून देने वाला साथी - संगीत।", "🌟 दिल की बात, संगीत के साथ।",
            "✨ जिंदगी को गुनगुनाने की कला है संगीत।", "🎵 म्यूजिक - आत्मा का आईना।",
            "🤎 सुरों के बिना सब अधूरा है।", "🎶 संगीत - मन की शांति का जरिया।",
            "💫 जो न कह सको, वो गाने में कह दो।", "🌟 दिल के करीब, संगीत के साज़।",
            "🎵 संगीत, जो वक्त को थमने पर मजबूर कर दे।", "✨ सुनहरे पल, सुरीले गाने।",
            "🤎 जहाँ संगीत है, वहाँ जिंदगी है।", "🎶 सुरों के साथ, सुकून की बात।"
        ];

        // 🌟 LOAD PLAYLIST JSON 🌟
        fetch('playlist.json').then(r => r.json()).then(data => {
            playlistData = data;
            if (playlistData.length > 0) {
                const randomIdx = Math.floor(Math.random() * playlistData.length);
                loadTrack(randomIdx);
            }
        });

        // 🌟 PLAY TRACK FUNCTION 🌟
        function loadTrack(index) {
            currentTrackIndex = index;
            const track = playlistData[index];
            showLoading();
            audio.src = track.src;
            document.getElementById("title").innerText = track.title;
            document.getElementById("artist").innerText = track.artist;
            document.getElementById("cover").src = track.cover;

            const randomQuote = shayariList[Math.floor(Math.random() * shayariList.length)];
            document.getElementById("quote-text").innerText = `"${randomQuote}"`;

            audio.play().catch(e => console.log(e));
        }

        // 🌟 UI STATES 🌟
        function showLoading() {
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-loader").style.display = "block";
            document.getElementById("player").classList.remove("playing");
        }

        audio.addEventListener("playing", () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "block";
            document.getElementById("player").classList.add("playing");
        });

        audio.addEventListener("pause", () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-play").style.display = "block";
            document.getElementById("player").classList.remove("playing");
        });

        // 🌟 CONTROLS 🌟
        playBtn.addEventListener("click", () => {
            if (audio.paused) { audio.play().catch(e => console.log(e)); }
            else { audio.pause(); }
        });

        shuffleBtn.addEventListener("click", () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle("is-on");
        });

        function playNext() {
            if (!playlistData.length) return;
            if (isShuffle) loadTrack(Math.floor(Math.random() * playlistData.length));
            else loadTrack((currentTrackIndex + 1) % playlistData.length);
        }

        function playPrev() {
            if (!playlistData.length) return;
            loadTrack((currentTrackIndex - 1 + playlistData.length) % playlistData.length);
        }

        document.getElementById("next").addEventListener("click", playNext);
        document.getElementById("prev").addEventListener("click", playPrev);
        audio.addEventListener("ended", playNext);

        // 🌟 PLAYLIST MODAL & SEARCH 🌟
        document.getElementById("listBtn").addEventListener("click", () => {
            document.getElementById("playlist-modal").classList.add("open");
            renderList();
        });

        document.getElementById("close-modal").addEventListener("click", () => document.getElementById("playlist-modal").classList.remove("open"));

        function renderList() {
            optionsList.innerHTML = "";
            playlistData.forEach((t, i) => {
                let li = document.createElement("li");
                li.innerHTML = `
                    <img src="${t.cover}" alt="Cover">
                    <div>
                        <span class="s-title">${t.title}</span>
                        <span class="s-artist">${t.artist}</span>
                    </div>
                `;
                li.onclick = () => { loadTrack(i); document.getElementById("playlist-modal").classList.remove("open"); };
                optionsList.appendChild(li);
            });
        }

        songSearch.addEventListener("input", (e) => {
            const val = e.target.value.toLowerCase();
            const items = optionsList.getElementsByTagName("li");
            Array.from(items).forEach(li => {
                li.style.display = li.innerText.toLowerCase().includes(val) ? "flex" : "none";
            });
        });

        // 🌟 TIME & SEEK BAR (Fix Infinity:NaN) 🌟
        audio.addEventListener("timeupdate", () => {
            let curMin = Math.floor(audio.currentTime / 60);
            let curSec = Math.floor(audio.currentTime % 60);
            document.getElementById("tCur").innerText = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;

            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById("seek-bar").value = percent;
                document.getElementById("seek-bar").style.setProperty('--progress', `${percent}%`);

                let durMin = Math.floor(audio.duration / 60);
                let durSec = Math.floor(audio.duration % 60);
                document.getElementById("tDur").innerText = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
            } else {
                document.getElementById("tDur").innerText = "0:00";
            }
        });

        document.getElementById("seek-bar").addEventListener("input", (e) => {
            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
        });

        // 🌟 VOLUME 200% LOGIC 🌟
        let clickTimer = null, isVolPopupOpen = false;
        const muteBtn = document.getElementById("mute-btn"), volPopup = document.getElementById("vol-popup"), volumeBar = document.getElementById("volume-bar");

        muteBtn.addEventListener("click", (e) => {
            if (e.detail === 1) {
                clickTimer = setTimeout(() => {
                    isVolPopupOpen = !isVolPopupOpen;
                    if (isVolPopupOpen) volPopup.classList.add("show");
                    else volPopup.classList.remove("show");
                }, 200);
            }
        });

        window.addEventListener("click", (e) => {
            if (e.target !== muteBtn && !muteBtn.contains(e.target) && e.target !== volPopup && !volPopup.contains(e.target)) {
                volPopup.classList.remove("show"); isVolPopupOpen = false;
            }
        });

        volumeBar.style.setProperty('--progress', '50%');
        volumeBar.addEventListener("input", (e) => {
            const newVol = parseFloat(e.target.value);
            audio.volume = Math.min(newVol, 1);
            volumeBar.style.setProperty('--progress', `${(newVol / 2) * 100}%`);
            document.getElementById("vol-percent-text").innerText = Math.round(newVol * 100) + "%";
        });
    </script>
</body>

</html>
