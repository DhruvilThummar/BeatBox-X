    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* Hide scrollbars visually across all elements */
        ::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0a0a0c;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            display: flex;
            flex-direction: column;
            background: linear-gradient(-45deg, #0a0a0c, #1a1a24, #0a0a0c, #1f1f2e);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🌟 STICKY TOP APP BAR 🌟 */
        .top-app-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(56px + env(safe-area-inset-top, 0px));
            padding-top: env(safe-area-inset-top, 0px);
            padding-left: max(20px, env(safe-area-inset-left, 0px));
            padding-right: max(20px, env(safe-area-inset-right, 0px));
            background: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 400;
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: rgba(212, 175, 55, 0.95);
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
            margin: 0;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 🌟 MAIN APP SCROLL AREA 🌟 */
        .app-main {
            flex: 1;
            height: 100dvh;
            width: 100vw;
            overflow-y: auto;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: calc(56px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            position: relative;
            z-index: 1;
        }

        /* 🌟 FIXED BOTTOM NAVIGATION BAR 🌟 */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(64px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            background: rgba(10, 10, 14, 0.92);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 500;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            background: transparent;
            border: none;
            cursor: pointer;
            min-width: 48px;
            min-height: 48px;
            padding: 4px 12px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            gap: 3px;
            transition: color 0.2s, transform 0.15s ease, opacity 0.15s ease;
        }

        .nav-item.active {
            color: #D4AF37;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .nav-item:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        /* 🌟 GLASSMORPHISM CARDS 🌟 */
        .ios-glass {
            background: rgba(18, 18, 24, 0.88);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border: 1px solid rgba(212, 175, 55, 0.22);
            border-top: 1px solid rgba(212, 175, 55, 0.45);
        }

        /* 🌟 PLAYER BUTTONS (SPOTIFY & APPLE MUSIC STYLE) 🌟 */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.15);
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
            border-radius: 50%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .btn:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        .btn.is-on {
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.25);
            border-color: #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .btn--icon-only {
            background: transparent;
            border: none;
            min-width: 36px;
            min-height: 36px;
        }

        .btn--icon-only:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: none;
        }

        /* Favorite / Like Button */
        .btn--like .heart-filled {
            display: none;
            color: #FF4D6D;
        }

        .btn--like.is-liked .heart-outline {
            display: none;
        }

        .btn--like.is-liked .heart-filled {
            display: block;
            animation: heartBeat 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes heartBeat {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Repeat Badge */
        .repeat-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 9px;
            font-weight: 800;
            background: #D4AF37;
            color: #000;
            border-radius: 50%;
            width: 13px;
            height: 13px;
            display: none;
            line-height: 13px;
            text-align: center;
        }

        /* Large Play/Pause Primary Orb */
        .btn--play {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #9A7B1C 100%);
            border-radius: 50%;
            width: 58px;
            height: 58px;
            color: #0a0a0c;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6);
        }

        .btn--play:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            border-color: #fff;
        }

        .btn--play:active {
            transform: scale(0.94);
        }

        .player.playing .btn--play {
            animation: playPulse 2.5s infinite;
        }

        @keyframes playPulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { box-shadow: 0 0 0 16px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .spinner {
            animation: rotate 1.8s linear infinite;
            width: 26px;
            height: 26px;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* 🌟 SEEK BAR & SLIDER 🌟 */
        .seek-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            white-space: nowrap;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            --progress: 0%;
            background-image: linear-gradient(90deg, #D4AF37, #FFD700);
            background-size: var(--progress) 100%;
            background-repeat: no-repeat;
            transition: height 0.15s;
        }

        input[type="range"]:hover {
            height: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.9);
            transition: transform 0.15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* 🌟 VOLUME POPUP 🌟 */
        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vol-popup {
            position: absolute;
            bottom: 60px;
            left: 50%;
            border-radius: 20px;
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(15px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 600;
            background: rgba(18, 18, 24, 0.96);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .vol-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .vol-percentage {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #D4AF37;
        }

        .vol-slider-wrap {
            height: 100px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="range"]#volume-bar {
            width: 100px;
            height: 6px;
            transform: rotate(-90deg);
            background-image: linear-gradient(#D4AF37, #FFD700);
        }

        .options {

        .options li {

        /* 🌟 SKELETON LOADERS (ZERO CLS) 🌟 */

        .skeleton-bar { height: 6px; width: 100%; border-radius: 3px; }
    </style>
</head>

    <script>
        let playlistData = [];
        let currentTrackIndex = 0;
        let isShuffle = false;
        let repeatMode = 'off'; // 'off', 'all', 'one'
        let isLiked = false;

        const audio = document.getElementById("audio-player");
        const optionsList = document.getElementById("options-list");
        const songSearch = document.getElementById("song-search");
        const playBtn = document.getElementById("play");
        const shuffleBtn = document.getElementById("shuffle");
        const repeatBtn = document.getElementById("repeat");
        const repeatBadge = document.getElementById("repeat-badge");
        const likeBtn = document.getElementById("like-btn");

        const shayariList = [
            "✨ कुछ धुनें कभी पुरानी नहीं होतीं, बस यादें ताज़ा कर देती हैं।",
            "🤎 लफ़्ज़ों की कमी को, संगीत अक्सर पूरा कर देता है।",
            "🎶 वो गीत ही क्या, जो दिल के तारों को न छुए।",
            "🌟 शोर भरी इस दुनिया में, संगीत ही मेरा सुकून है।",
            "🎵 हर गाने में एक चेहरा, और हर चेहरे में एक कहानी छिपी होती है।",
            "💫 कुछ बातें होंठों से नहीं, बस इयरफ़ोन से समझी जाती हैं।",
            "✨ संगीत वो जादू है, जो बिना छुए दिल को सहला देता है।"
        ];

        // 🌟 LOAD PLAYLIST & SWAP SKELETON FOR PLAYER 🌟
        fetch('playlist.json').then(r => r.json()).then(data => {
            playlistData = data;
            if (playlistData.length > 0) {
                const randomIdx = Math.floor(Math.random() * playlistData.length);
                loadTrack(randomIdx);
            }

            // Smooth skeleton fallback transition
            const skeletonEl = document.getElementById("player-skeleton");
            const playerEl = document.getElementById("player");
            if (skeletonEl && playerEl) {
                skeletonEl.style.opacity = "0";
                setTimeout(() => {
                    skeletonEl.style.display = "none";
                    playerEl.style.display = "flex";
                    requestAnimationFrame(() => {
                        playerEl.style.opacity = "1";
                    });
                }, 300);
            }
        });

        // 🌟 PLAY TRACK FUNCTION & FULL LOCK SCREEN CONTROLS 🌟
        function loadTrack(index) {
            currentTrackIndex = index;
            const track = playlistData[index];
            showLoading();
            audio.src = track.src;
            audio.playbackRate = speeds[speedIdx];
            document.getElementById("title").innerText = track.title;
            document.getElementById("artist").innerText = track.artist;
            document.getElementById("cover").src = track.cover;

            const randomQuote = shayariList[Math.floor(Math.random() * shayariList.length)];
            document.getElementById("quote-text").innerText = `"${randomQuote}"`;

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: 'Beat Box X',
                    artwork: [
                        { src: track.cover, sizes: '96x96', type: 'image/jpeg' },
                        { src: track.cover, sizes: '128x128', type: 'image/jpeg' },
                        { src: track.cover, sizes: '192x192', type: 'image/jpeg' },
                        { src: track.cover, sizes: '256x256', type: 'image/jpeg' },
                        { src: track.cover, sizes: '384x384', type: 'image/jpeg' },
                        { src: track.cover, sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { audio.play().catch(e => console.log(e)); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);

                try {
                    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                        const skipTime = details.seekOffset || 10;
                        audio.currentTime = Math.max(audio.currentTime - skipTime, 0);
                        updatePositionState();
                    });
                    navigator.mediaSession.setActionHandler('seekforward', (details) => {
                        const skipTime = details.seekOffset || 10;
                        audio.currentTime = Math.min(audio.currentTime + skipTime, audio.duration || 0);
                        updatePositionState();
                    });
                    navigator.mediaSession.setActionHandler('seekto', (details) => {
                        if (details.fastSeek && ('fastSeek' in audio)) {
                            audio.fastSeek(details.seekTime);
                        } else {
                            audio.currentTime = details.seekTime;
                        }
                        updatePositionState();
                    });
                    navigator.mediaSession.setActionHandler('stop', () => {
                        audio.pause();
                        audio.currentTime = 0;
                    });
                } catch (e) {
                    console.log('MediaSession handler error: ', e);
                }
            }

            audio.play().catch(e => console.log(e));
        }

        // 🌟 LOCK SCREEN POSITION STATE SYNC 🌟
        function updatePositionState() {
            if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime
                    });
                }
            }
        }

        // 🌟 PLAYBACK SPEED & REWIND/FORWARD CONTROLLERS 🌟
        const speeds = [0.75, 1.0, 1.25, 1.5, 2.0];
        let speedIdx = 1;
        const speedBtn = document.getElementById("speed-btn");
        const rewind10Btn = document.getElementById("rewind-10");
        const forward10Btn = document.getElementById("forward-10");

        speedBtn.addEventListener("click", () => {
            speedIdx = (speedIdx + 1) % speeds.length;
            const newSpeed = speeds[speedIdx];
            audio.playbackRate = newSpeed;
            speedBtn.innerText = `${newSpeed.toFixed(newSpeed % 1 === 0 ? 1 : 2)}x`;
            updatePositionState();
        });

        rewind10Btn.addEventListener("click", () => {
            if (audio.duration) {
                audio.currentTime = Math.max(audio.currentTime - 10, 0);
                updatePositionState();
            }
        });

        forward10Btn.addEventListener("click", () => {
            if (audio.duration) {
                audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
                updatePositionState();
            }
        });

        // 🌟 UI LOADING & PLAYBACK STATES 🌟
        function showLoading() {
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-loader").style.display = "block";
            document.getElementById("player").classList.remove("playing");
        }

        audio.addEventListener("playing", () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-play").style.display = "none";
            document.getElementById("i-pause").style.display = "block";
            document.getElementById("player").classList.add("playing");
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        });

        audio.addEventListener("pause", () => {
            document.getElementById("i-loader").style.display = "none";
            document.getElementById("i-pause").style.display = "none";
            document.getElementById("i-play").style.display = "block";
            document.getElementById("player").classList.remove("playing");
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        });

        playBtn.addEventListener("click", () => {
            if (audio.paused) { audio.play().catch(e => console.log(e)); }
            else { audio.pause(); }
        });

        shuffleBtn.addEventListener("click", () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle("is-on", isShuffle);
        });

        // 🌟 REPEAT MODE CYCLE (OFF -> ALL -> ONE) 🌟
        repeatBtn.addEventListener("click", () => {
            if (repeatMode === 'off') {
                repeatMode = 'all';
                repeatBtn.classList.add("is-on");
                repeatBtn.setAttribute("title", "Repeat All");
                repeatBadge.style.display = "none";
            } else if (repeatMode === 'all') {
                repeatMode = 'one';
                repeatBtn.classList.add("is-on");
                repeatBtn.setAttribute("title", "Repeat One");
                repeatBadge.style.display = "block";
            } else {
                repeatMode = 'off';
                repeatBtn.classList.remove("is-on");
                repeatBtn.setAttribute("title", "Repeat Off");
                repeatBadge.style.display = "none";
            }
        });

        // 🌟 LIKE / FAVORITE TOGGLE 🌟
        likeBtn.addEventListener("click", () => {
            isLiked = !isLiked;
            likeBtn.classList.toggle("is-liked", isLiked);
        });

        function playNext() {
            if (!playlistData.length) return;
            if (repeatMode === 'one') {
                loadTrack(currentTrackIndex);
            } else if (isShuffle) {
                loadTrack(Math.floor(Math.random() * playlistData.length));
            } else {
                loadTrack((currentTrackIndex + 1) % playlistData.length);
            }
        }

        function playPrev() {
            if (!playlistData.length) return;
            loadTrack((currentTrackIndex - 1 + playlistData.length) % playlistData.length);
        }

        document.getElementById("next").addEventListener("click", playNext);
        document.getElementById("prev").addEventListener("click", playPrev);

        audio.addEventListener("ended", () => {
            if (repeatMode === 'one') {
                audio.currentTime = 0;
                audio.play().catch(e => console.log(e));
            } else if (repeatMode === 'off' && currentTrackIndex === playlistData.length - 1 && !isShuffle) {
                audio.pause();
            } else {
                playNext();
            }
        });

        // 🌟 PLAYLIST MODAL & SEARCH 🌟
        const openModal = () => {
            document.getElementById("playlist-modal").classList.add("open");
            renderList();
        };

        const closeModal = () => document.getElementById("playlist-modal").classList.remove("open");

        document.getElementById("listBtn").addEventListener("click", openModal);
        document.getElementById("top-search-btn").addEventListener("click", openModal);
        document.getElementById("nav-search").addEventListener("click", openModal);
        document.getElementById("nav-playlist").addEventListener("click", openModal);
        document.getElementById("close-modal").addEventListener("click", closeModal);

        function renderList() {
            optionsList.innerHTML = "";
            playlistData.forEach((t, i) => {
                let li = document.createElement("li");
                li.innerHTML = `
                    <img src="${t.cover}" alt="Cover">
                    <div>
                        <span class="s-title">${t.title}</span>
                        <span class="s-artist">${t.artist}</span>
                    </div>
                `;
                li.onclick = () => { loadTrack(i); closeModal(); };
                optionsList.appendChild(li);
            });
        }

        songSearch.addEventListener("input", (e) => {
            const val = e.target.value.toLowerCase();
            const items = optionsList.getElementsByTagName("li");
            Array.from(items).forEach(li => {
                li.style.display = li.innerText.toLowerCase().includes(val) ? "flex" : "none";
            });
        });

        // 🌟 TIME & SEEK BAR 🌟
        audio.addEventListener("timeupdate", () => {
            let curMin = Math.floor(audio.currentTime / 60);
            let curSec = Math.floor(audio.currentTime % 60);
            document.getElementById("tCur").innerText = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;

            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById("seek-bar").value = percent;
                document.getElementById("seek-bar").style.setProperty('--progress', `${percent}%`);

                let durMin = Math.floor(audio.duration / 60);
                let durSec = Math.floor(audio.duration % 60);
                document.getElementById("tDur").innerText = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
                updatePositionState();
            } else {
                document.getElementById("tDur").innerText = "0:00";
            }
        });

        document.getElementById("seek-bar").addEventListener("input", (e) => {
            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
        });

        // 🌟 VOLUME 200% LOGIC & DYNAMIC ICONS 🌟
        let isVolPopupOpen = false;
        const muteBtn = document.getElementById("mute-btn"), volPopup = document.getElementById("vol-popup"), volumeBar = document.getElementById("volume-bar");
        let lastVolume = 1;

        function updateVolumeIcon(vol) {
            const volHigh = document.getElementById("vol-icon-high");
            const volLow = document.getElementById("vol-icon-low");
            const volMute = document.getElementById("vol-icon-mute");
            
            if (vol === 0 || audio.muted) {
                volHigh.style.display = "none";
                volLow.style.display = "none";
                volMute.style.display = "block";
            } else if (vol < 0.5) {
                volHigh.style.display = "none";
                volLow.style.display = "block";
                volMute.style.display = "none";
            } else {
                volHigh.style.display = "block";
                volLow.style.display = "none";
                volMute.style.display = "none";
            }
        }

        muteBtn.addEventListener("click", (e) => {
            isVolPopupOpen = !isVolPopupOpen;
            if (isVolPopupOpen) volPopup.classList.add("show");
            else volPopup.classList.remove("show");
        });

        window.addEventListener("click", (e) => {
            if (e.target !== muteBtn && !muteBtn.contains(e.target) && e.target !== volPopup && !volPopup.contains(e.target)) {
                volPopup.classList.remove("show"); isVolPopupOpen = false;
            }
        });

        volumeBar.style.setProperty('--progress', '50%');
        volumeBar.addEventListener("input", (e) => {
            const newVol = parseFloat(e.target.value);
            audio.volume = Math.min(newVol, 1);
            volumeBar.style.setProperty('--progress', `${(newVol / 2) * 100}%`);
            document.getElementById("vol-percent-text").innerText = Math.round(newVol * 100) + "%";
            updateVolumeIcon(newVol);
        });

        // 🌟 KEYBOARD SHORTCUTS FOR PC DESKTOP CONVENIENCE 🌟
        window.addEventListener("keydown", (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (audio.paused) audio.play().catch(err => console.log(err));
                else audio.pause();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                if (audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                if (audio.duration) audio.currentTime = Math.max(audio.currentTime - 5, 0);
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                const newVol = Math.min(parseFloat(volumeBar.value) + 0.1, 2);
                volumeBar.value = newVol;
                volumeBar.dispatchEvent(new Event('input'));
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                const newVol = Math.max(parseFloat(volumeBar.value) - 0.1, 0);
                volumeBar.value = newVol;
                volumeBar.dispatchEvent(new Event('input'));
            } else if (e.code === 'KeyM') {
                e.preventDefault();
                if (audio.volume > 0) {
                    lastVolume = volumeBar.value;
                    volumeBar.value = 0;
                } else {
                    volumeBar.value = lastVolume || 1;
                }
                volumeBar.dispatchEvent(new Event('input'));
            }
        });
    </script>

    <!-- 🌟 ASYNCHRONOUS LAZY LOADING OF HEAVY 3D BACKGROUND (MULTI-CDN FALLBACK & RELIABLE INIT) 🌟 -->
    <script>
        function load3DBackground() {
            if (window._threeBgInitialized) return;
            window._threeBgInitialized = true;

            if (window.ThreeBackground && window.THREE) {
                try {
                    new window.ThreeBackground({
                        primaryColor: 0xD4AF37,
                        secondaryColor: 0x4a3b10,
                        particleCount: 1000
                    });
                } catch(e) { console.warn("3D Background Init Exception:", e); }
                return;
            }

            const cdnUrls = [
                "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
                "https://unpkg.com/three@0.128.0/build/three.min.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ];
            let cdnIdx = 0;

            function tryNextCDN() {
                if (cdnIdx >= cdnUrls.length) {
                    console.warn("All Three.js CDN sources failed to load.");
                    return;
                }
                const threeScript = document.createElement('script');
                threeScript.src = cdnUrls[cdnIdx];
                threeScript.async = true;
                threeScript.onload = () => {
                    const bgScript = document.createElement('script');
                    bgScript.src = "three-bg.js";
                    bgScript.async = true;
                    bgScript.onload = () => {
                        if (window.ThreeBackground) {
                            try {
                                new window.ThreeBackground({
                                    primaryColor: 0xD4AF37,
                                    secondaryColor: 0x4a3b10,
                                    particleCount: 1000
                                });
                            } catch(e) { console.warn("3D Background error:", e); }
                        }
                    };
                    document.body.appendChild(bgScript);
                };
                threeScript.onerror = () => {
                    cdnIdx++;
                    tryNextCDN();
                };
                document.body.appendChild(threeScript);
            }

            tryNextCDN();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', load3DBackground);
        } else {
            load3DBackground();
        }

        // 🌟 SERVICE WORKER REGISTRATION (PWA & OFFLINE SHELL CACHING) 🌟
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Beat Box X PWA Active: ', reg.scope))
                    .catch(err => console.log('Service Worker failed: ', err));
            });
        }
    </script>
