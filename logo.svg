<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian & Deep Indigo Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0919"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>

    <!-- Ambient Radial Glow Behind the Icon Graphic -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerCoreGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Premium Wave Gradients -->
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="30%" stop-color="#FF007F"/>
      <stop offset="70%" stop-color="#8338EC"/>
      <stop offset="100%" stop-color="#3A86FF"/>
    </linearGradient>

    <linearGradient id="neonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#7000FF"/>
      <stop offset="75%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>

    <!-- Glass Rim & Specular Gradients -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.5)"/>
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="70%" stop-color="rgba(0, 240, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 0, 127, 0.35)"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)"/>
    </linearGradient>

    <linearGradient id="specularLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="80%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- High-Performance Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feGaussianBlur stdDeviation="28" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card Drop Shadow Filter -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#7000FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base App Icon Card -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#bgGrad)" filter="url(#cardShadow)"/>

  <!-- Ambient Light Reflection inside Card -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#ambientGlow)"/>
  <circle cx="200" cy="200" r="130" fill="url(#centerCoreGlow)"/>

  <!-- Liquid Glass Overlay & Border Rim -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="2"/>

  <!-- Top Curved Specular Glass Highlight -->
  <path d="M 85 31 C 140 31, 260 31, 315 31" stroke="url(#specularLine)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Decorative Particle Stars / Ambient Nodes -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="95" cy="105" r="1.5"/>
    <circle cx="305" cy="95" r="1.5"/>
    <circle cx="85" cy="295" r="1.5"/>
    <circle cx="310" cy="285" r="2"/>
    <circle cx="140" cy="70" r="1"/>
    <circle cx="260" cy="330" r="1"/>
  </g>

  <!-- Dynamic Wave-X Logo Graphic -->
  <g filter="url(#neonGlow)">
    
    <!-- Outer Secondary Fluid Waves (Back Layer) -->
    <path d="M 100 130 C 145 80, 160 270, 200 200 C 240 130, 255 320, 300 270" 
          fill="none" stroke="url(#neonGrad1)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    
    <path d="M 300 130 C 255 80, 240 270, 200 200 C 160 130, 145 320, 100 270" 
          fill="none" stroke="url(#neonGrad2)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

    <!-- Main Dynamic Wave Strand 1 (Diagonal Top-Left to Bottom-Right) -->
    <path d="M 110 110 C 160 120, 150 280, 200 200 C 250 120, 240 280, 290 290" 
          fill="none" stroke="url(#neonGrad1)" stroke-width="12" stroke-linecap="round"/>

    <!-- Main Dynamic Wave Strand 2 (Diagonal Top-Right to Bottom-Left) -->
    <path d="M 290 110 C 240 120, 250 280, 200 200 C 150 120, 160 280, 110 290" 
          fill="none" stroke="url(#neonGrad2)" stroke-width="12" stroke-linecap="round"/>

    <!-- Center Pulse Energy Core -->
    <circle cx="200" cy="200" r="22" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>
    <circle cx="200" cy="200" r="14" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.8"/>
    <circle cx="200" cy="200" r="7" fill="#FFFFFF"/>

  </g>

  <!-- Bright Accent Terminal Points -->
  <g fill="#FFFFFF" filter="url(#neonGlow)">
    <circle cx="110" cy="110" r="4" fill="#FFD166"/>
    <circle cx="290" cy="110" r="4" fill="#00F0FF"/>
    <circle cx="110" cy="290" r="4" fill="#FF007F"/>
    <circle cx="290" cy="290" r="4" fill="#3A86FF"/>
  </g>
</svg>
