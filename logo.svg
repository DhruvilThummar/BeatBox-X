<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian & Warm Mahogany Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181014"/>
      <stop offset="50%" stop-color="#0a0709"/>
      <stop offset="100%" stop-color="#040203"/>
    </linearGradient>

    <!-- Warm Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#AA6C39" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#900C3F" stop-opacity="0"/>
    </radialGradient>

    <!-- Premium Metallic Gold & Bronze Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#8A5A19"/>
      <stop offset="100%" stop-color="#3E270A"/>
    </linearGradient>

    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEA8C"/>
      <stop offset="35%" stop-color="#E5A93D"/>
      <stop offset="75%" stop-color="#9A4324"/>
      <stop offset="100%" stop-color="#4A180E"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#900C3F"/>
      <stop offset="50%" stop-color="#C70039"/>
      <stop offset="100%" stop-color="#FF5733"/>
    </linearGradient>

    <!-- Glass Rim & Specular Highlights -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 234, 140, 0.6)"/>
      <stop offset="30%" stop-color="rgba(212, 175, 55, 0.15)"/>
      <stop offset="70%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(170, 108, 57, 0.4)"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 234, 140, 0.08)"/>
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0.02)"/>
    </linearGradient>

    <linearGradient id="specularLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="20%" stop-color="rgba(255,240,180,0.5)"/>
      <stop offset="80%" stop-color="rgba(255,240,180,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#D4AF37" flood-opacity="0.2"/>
    </filter>

    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmering Star Element -->
    <g id="star">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#FFEA8C"/>
    </g>
  </defs>

  <!-- Base Card -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  
  <!-- Ambient Core Lighting -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#ambientGlow)"/>
  <circle cx="200" cy="200" r="140" fill="url(#rubyGlow)"/>

  <!-- Liquid Glass Overlay & Border Rim -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="2.5"/>

  <!-- Top Specular Highlight -->
  <path d="M 85 31.5 C 140 31.5, 260 31.5, 315 31.5" stroke="url(#specularLine)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Star Particles and Ambient Dust -->
  <g opacity="0.65">
    <use href="#star" x="120" y="90" transform="scale(0.8)"/>
    <use href="#star" x="290" y="110" transform="scale(1.2)"/>
    <use href="#star" x="90" y="270" transform="scale(1)"/>
    <use href="#star" x="280" y="290" transform="scale(0.9)"/>
    <use href="#star" x="200" y="65" transform="scale(0.6)"/>
    <use href="#star" x="150" y="310" transform="scale(0.7)"/>
    
    <!-- Dust Motes -->
    <circle cx="100" cy="180" r="1.5" fill="#FFF3A1"/>
    <circle cx="310" cy="220" r="2" fill="#FFF3A1"/>
    <circle cx="170" cy="110" r="1" fill="#FFF3A1"/>
    <circle cx="230" cy="300" r="1.5" fill="#FFF3A1"/>
    <circle cx="85" cy="130" r="1" fill="#FFF3A1"/>
    <circle cx="295" cy="250" r="1" fill="#FFF3A1"/>
  </g>

  <!-- Fluid Metallic Ribbons (Back Layer - Crimson & Deep Bronze) -->
  <g filter="url(#glowFilter)">
    <!-- Top Left to Center -->
    <path d="M 80 120 C 140 120, 130 190, 200 200" fill="none" stroke="url(#crimsonGrad)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    <!-- Bottom Right to Center -->
    <path d="M 320 280 C 260 280, 270 210, 200 200" fill="none" stroke="url(#crimsonGrad)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    <!-- Top Right to Center -->
    <path d="M 320 120 C 260 120, 270 190, 200 200" fill="none" stroke="url(#goldGrad2)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <!-- Bottom Left to Center -->
    <path d="M 80 280 C 140 280, 130 210, 200 200" fill="none" stroke="url(#goldGrad2)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Fluid Metallic Ribbons (Front Layer - Bright Gold) -->
  <!-- Top Left -->
  <path d="M 75 140 C 145 130, 140 195, 175 200" fill="none" stroke="url(#goldGrad1)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 80 140 C 145 130, 140 195, 175 200" fill="none" stroke="#FFEA8C" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Bottom Right -->
  <path d="M 325 260 C 255 270, 260 205, 225 200" fill="none" stroke="url(#goldGrad1)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 320 260 C 255 270, 260 205, 225 200" fill="none" stroke="#FFEA8C" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Top Right -->
  <path d="M 315 145 C 245 135, 255 195, 220 200" fill="none" stroke="url(#goldGrad2)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 315 145 C 245 135, 255 195, 220 200" fill="none" stroke="#FFF3A1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom Left -->
  <path d="M 85 255 C 155 265, 145 205, 180 200" fill="none" stroke="url(#goldGrad2)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 85 255 C 155 265, 145 205, 180 200" fill="none" stroke="#FFF3A1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Concentric Engraved Gold Rings -->
  <g filter="url(#glowFilter)">
    <circle cx="200" cy="200" r="65" fill="none" stroke="url(#goldGrad1)" stroke-width="2" opacity="0.4"/>
  </g>
  <circle cx="200" cy="200" r="65" fill="none" stroke="url(#goldGrad2)" stroke-width="6"/>
  <circle cx="200" cy="200" r="65" fill="none" stroke="#221105" stroke-width="2" opacity="0.6"/> <!-- Shadow ring -->

  <circle cx="200" cy="200" r="50" fill="none" stroke="url(#goldGrad1)" stroke-width="8"/>
  <circle cx="200" cy="200" r="50" fill="none" stroke="#FFF3A1" stroke-width="1.5" opacity="0.5"/> <!-- Highlight -->

  <circle cx="200" cy="200" r="38" fill="none" stroke="url(#goldGrad2)" stroke-width="5"/>
  <circle cx="200" cy="200" r="28" fill="none" stroke="url(#goldGrad1)" stroke-width="3"/>

  <!-- Dark Core Backing for Gem -->
  <circle cx="200" cy="200" r="22" fill="#110508"/>

  <!-- Multi-Faceted Ruby Centerpiece -->
  <g transform="translate(200, 200)">
    <!-- Outer Gem Silhouette -->
    <polygon points="0,-20 14,-14 20,0 14,14 0,20 -14,14 -20,0 -14,-14" fill="#900C3F" stroke="#FF5733" stroke-width="1"/>
    
    <!-- Top facets -->
    <polygon points="0,-20 14,-14 8,-6 0,-10 -8,-6 -14,-14" fill="#FF5733"/>
    <polygon points="0,-20 0,-10 14,-14" fill="#FF8D70" opacity="0.6"/> <!-- Specular hit -->
    
    <!-- Right facets -->
    <polygon points="14,-14 20,0 10,0 8,-6" fill="#C70039"/>
    <polygon points="20,0 14,14 8,6 10,0" fill="#900C3F"/>
    
    <!-- Bottom facets -->
    <polygon points="14,14 0,20 0,10 8,6" fill="#581845"/>
    <polygon points="0,20 -14,14 -8,6 0,10" fill="#400A25"/>
    
    <!-- Left facets -->
    <polygon points="-14,14 -20,0 -10,0 -8,6" fill="#581845"/>
    <polygon points="-20,0 -14,-14 -8,-6 -10,0" fill="#900C3F"/>
    
    <!-- Center core facet (Table of the gem) -->
    <polygon points="0,-10 8,-6 10,0 8,6 0,10 -8,6 -10,0 -8,-6" fill="#C70039"/>
    
    <!-- Center inner glow / reflection -->
    <polygon points="0,-5 4,-3 5,0 4,3 0,5 -4,3 -5,0 -4,-3" fill="#FF5733" opacity="0.8"/>
  </g>

  <!-- Accent Nodes on Ribbon Ends -->
  <g fill="url(#goldGrad1)">
    <circle cx="75" cy="140" r="4.5"/>
    <circle cx="325" cy="260" r="4.5"/>
  </g>
  <g fill="url(#goldGrad2)">
    <circle cx="315" cy="145" r="4"/>
    <circle cx="85" cy="255" r="4"/>
  </g>
</svg>
