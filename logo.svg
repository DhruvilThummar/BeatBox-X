<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
        <!-- Neon Aqua Gradient (Website na theme pramane) -->
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#23d5ab"/>
            <stop offset="100%" stop-color="#0f5c49"/>
        </linearGradient>
        
        <!-- Liquid Glass Theme -->
        <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
        </linearGradient>
        
        <!-- 3D Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Dark Background Plate (App Icon Shape) -->
    <rect x="20" y="20" width="360" height="360" rx="80" fill="#1f1c2c" filter="url(#shadow)"/>
    
    <!-- Inner Glass Plate -->
    <rect x="40" y="40" width="320" height="320" rx="60" fill="url(#glass)" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

    <!-- Glowing Sound Waves / Equalizer (The "Beat") -->
    <rect x="110" y="180" width="30" height="80" rx="15" fill="url(#grad1)"/>
    <rect x="160" y="110" width="30" height="150" rx="15" fill="url(#grad1)"/>
    <rect x="210" y="140" width="30" height="120" rx="15" fill="url(#grad1)"/>
    <rect x="260" y="200" width="30" height="60" rx="15" fill="url(#grad1)"/>

</svg>
